<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zM9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm-8 4H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/>
          </svg>
        </div>
        <span class="brand-title">PulseTracker</span>
      </div>
      <div class="header-actions">
        <div id="status-indicator" class="status-badge" title="Status: Checking...">
          <span class="status-dot"></span>
          <span id="status-text" class="status-label">Live</span>
        </div>
        <button id="settings-toggle-btn" class="icon-btn" title="Settings">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Settings Pane (collapsible) -->
    <div id="settings-pane" class="settings-pane hidden">
      <label class="settings-label" for="api-url-input">Dashboard API URL</label>
      <div class="settings-input-group">
        <input type="text" id="api-url-input" value="http://localhost:3001" placeholder="http://localhost:3001" />
        <button id="save-settings-btn" class="btn-sm">Save</button>
      </div>
    </div>

    <!-- Date Banner -->
    <div class="date-banner">
      <span id="current-date-text">Today</span>
      <span id="streak-badge" class="streak-pill">
        🔥 <span id="streak-count">0</span>-day streak
      </span>
    </div>

    <!-- Category Tabs -->
    <div class="tabs-container">
      <div id="metric-tabs" class="tabs-scroll">
        <!-- Injected dynamically: [Jobs] [LeetCode] ... -->
      </div>
      <button id="add-metric-tab-btn" class="tab-add-btn" title="Add another tracker (e.g. LeetCode, Cold Email)">+</button>
    </div>

    <!-- Hero Counter Card -->
    <div class="counter-card" id="counter-card">
      <div class="counter-display">
        <span id="metric-count" class="counter-number">0</span>
        <span id="metric-unit-label" class="counter-label">applied today</span>
      </div>

      <div class="action-buttons">
        <button id="quick-add-btn" class="btn-primary">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span id="quick-add-label">+1 Applied</span>
        </button>
        <button id="undo-btn" class="btn-secondary" title="Undo / Subtract 1">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Optional Detail Accordion -->
    <div class="details-section">
      <button id="toggle-details-btn" class="details-toggle">
        <span id="toggle-details-text">+ Add details (company, role, notes)</span>
        <svg id="details-arrow" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <form id="details-form" class="details-form hidden">
        <div class="form-row">
          <input type="text" id="detail-company" placeholder="Company / Problem name (e.g. Google, Two Sum)" />
        </div>
        <div class="form-row">
          <input type="text" id="detail-role" placeholder="Role / Tag (e.g. SWE Intern, Medium)" />
        </div>
        <div class="form-row">
          <input type="text" id="detail-notes" placeholder="Notes or job URL (optional)" />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-sm-primary" id="save-detail-btn">Save Entry</button>
        </div>
      </form>
    </div>

    <!-- Stats Summary Row -->
    <div class="summary-stats">
      <div class="stat-item">
        <span class="stat-value" id="stat-week">0</span>
        <span class="stat-name">This Week</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-value" id="stat-month">0</span>
        <span class="stat-name">This Month</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-name">Total</span>
      </div>
    </div>

    <!-- Dashboard Link -->
    <footer class="footer">
      <button id="open-dashboard-btn" class="dashboard-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>Open Calendar Dashboard</span>
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>
    </footer>

    <!-- New Metric Modal -->
    <div id="new-metric-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Add New Tracker</h3>
          <button id="close-metric-modal" class="close-btn">&times;</button>
        </div>
        <form id="new-metric-form">
          <div class="form-group">
            <label for="new-metric-name">Tracker Name</label>
            <input type="text" id="new-metric-name" placeholder="e.g., LeetCode, Cold Emails" required />
          </div>
          <div class="form-group">
            <label for="new-metric-unit">Unit / Action Label</label>
            <input type="text" id="new-metric-unit" placeholder="e.g., problems, emails" value="items" />
          </div>
          <div class="form-group">
            <label>Color Theme</label>
            <div class="color-palette" id="color-palette">
              <button type="button" class="color-option selected" data-color="#1a73e8" style="background-color: #1a73e8;"></button>
              <button type="button" class="color-option" data-color="#1e8e3e" style="background-color: #1e8e3e;"></button>
              <button type="button" class="color-option" data-color="#d93025" style="background-color: #d93025;"></button>
              <button type="button" class="color-option" data-color="#f9ab00" style="background-color: #f9ab00;"></button>
              <button type="button" class="color-option" data-color="#9334e6" style="background-color: #9334e6;"></button>
              <button type="button" class="color-option" data-color="#007b83" style="background-color: #007b83;"></button>
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" id="cancel-metric-btn" class="btn-cancel">Cancel</button>
            <button type="submit" class="btn-submit">Add Tracker</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
