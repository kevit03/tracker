<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="brand-dot"></div>
        <span class="brand-title">PulseTracker</span>
      </div>
      <div class="header-right">
        <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" title="Toggle theme">Dark</button>
        <span class="streak-pill" id="streak-pill">
          <span id="streak-count">0</span>-day streak
        </span>
      </div>
    </header>

    <!-- Google Account Bar -->
    <div class="account-bar" id="account-bar">
      <div class="account-info hidden" id="account-info">
        <div class="account-badge" id="account-badge">G</div>
        <span class="account-email" id="account-email">user@gmail.com</span>
        <button class="account-signout-btn" id="account-signout-btn" title="Sign Out">Sign Out</button>
      </div>
      <button class="account-signin-btn" id="account-signin-btn">
        Sign In with Google
      </button>
    </div>

    <div class="date-row" id="current-date-text"></div>

    <div class="tabs-bar">
      <div id="metric-tabs" class="tabs-scroll"></div>
      <button id="add-metric-tab-btn" class="tab-add-btn" title="Add tracker">+</button>
    </div>

    <div class="counter-card">
      <div class="counter-display">
        <span id="metric-count" class="counter-number">0</span>
        <span id="metric-unit-label" class="counter-label">applied today</span>
      </div>
      <div class="action-buttons">
        <button id="quick-add-btn" class="btn-primary">
          <span id="quick-add-label">+1 Applied</span>
        </button>
        <button id="undo-btn" class="btn-secondary" title="Undo">-1</button>
      </div>
    </div>

    <!-- LeetCode Solve Timer (active on LeetCode tab) -->
    <div id="leetcode-timer-widget" class="timer-widget hidden">
      <div class="timer-header">
        <span class="timer-title">Problem Solve Timer</span>
        <span class="timer-hint">Click time to type</span>
      </div>
      <div class="timer-controls-row">
        <div class="timer-input-wrap">
          <input type="text" id="timer-input" class="timer-input" value="00:00" placeholder="00:00" spellcheck="false" autocomplete="off" />
        </div>
        <div class="timer-btn-group">
          <button type="button" id="timer-toggle-btn" class="timer-btn timer-btn-start">Start</button>
          <button type="button" id="timer-reset-btn" class="timer-btn timer-btn-reset">Reset</button>
        </div>
      </div>
    </div>

    <!-- Daily Goal Progress Meter -->
    <div class="goal-meter" id="goal-meter">
      <div class="goal-header">
        <span class="goal-label">Daily Goal: <strong id="goal-target-num" title="Click to edit daily goal">5</strong></span>
        <span class="goal-status" id="goal-status-text">0 / 5</span>
      </div>
      <div class="goal-bar-wrap">
        <div class="goal-bar-fill" id="goal-bar-fill"></div>
      </div>
    </div>

    <div class="details-section">
      <button id="toggle-details-btn" class="details-toggle">
        <span>+ Add details (company, role, notes)</span>
        <span id="details-arrow" class="arrow-down"></span>
      </button>
      <form id="details-form" class="details-form hidden">
        <input type="text" id="detail-company" placeholder="Company or problem name" />
        <input type="text" id="detail-role" placeholder="Role or tag" />
        <input type="text" id="detail-notes" placeholder="Notes or URL" />
        <div class="form-actions">
          <button type="submit" class="btn-sm-primary">Save Entry</button>
        </div>
      </form>
    </div>

    <div class="summary-stats">
      <div class="stat-item">
        <span class="stat-value" id="stat-week">0</span>
        <span class="stat-name">This Week</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-value" id="stat-month">0</span>
        <span class="stat-name">This Month</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-name">Total</span>
      </div>
    </div>

    <!-- 30-Day Activity Summary Section -->
    <div class="activity-section">
      <button id="toggle-activity-btn" class="activity-toggle">
        <span id="activity-title">30-Day Activity</span>
        <span id="activity-arrow" class="arrow-down"></span>
      </button>
      <div id="activity-panel" class="activity-panel hidden">
        <div class="activity-bars" id="activity-bars"></div>
        <div class="activity-stats-grid">
          <div><div class="act-stat-num" id="pop-act-total">0</div><div class="act-stat-lbl">30D Total</div></div>
          <div><div class="act-stat-num" id="pop-act-avg">0.0</div><div class="act-stat-lbl">Daily Avg</div></div>
          <div><div class="act-stat-num" id="pop-act-days">0</div><div class="act-stat-lbl">Active Days</div></div>
          <div><div class="act-stat-num" id="pop-act-best">0</div><div class="act-stat-lbl">Best Day</div></div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <button id="open-calendar-btn" class="calendar-btn">
        View on Google Calendar
      </button>
    </footer>

    <!-- New metric modal -->
    <div id="new-metric-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Add New Tracker</h3>
          <button id="close-metric-modal" class="close-btn">&times;</button>
        </div>
        <form id="new-metric-form">
          <div class="form-group">
            <label for="new-metric-name">Name</label>
            <input type="text" id="new-metric-name" placeholder="e.g. Cold Emails, System Design" required />
          </div>
          <div class="form-group">
            <label for="new-metric-unit">Unit</label>
            <input type="text" id="new-metric-unit" placeholder="e.g. emails, sessions" value="items" />
          </div>
          <div class="form-group">
            <label for="new-metric-goal">Daily Goal</label>
            <input type="number" id="new-metric-goal" placeholder="e.g. 5" min="1" value="5" />
          </div>
          <div class="form-group">
            <label>Color</label>
            <div class="color-palette" id="color-palette">
              <button type="button" class="color-option selected" data-color="#1a73e8" style="background:#1a73e8;"></button>
              <button type="button" class="color-option" data-color="#1e8e3e" style="background:#1e8e3e;"></button>
              <button type="button" class="color-option" data-color="#d93025" style="background:#d93025;"></button>
              <button type="button" class="color-option" data-color="#f9ab00" style="background:#f9ab00;"></button>
              <button type="button" class="color-option" data-color="#9334e6" style="background:#9334e6;"></button>
              <button type="button" class="color-option" data-color="#007b83" style="background:#007b83;"></button>
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" id="cancel-metric-btn" class="btn-cancel">Cancel</button>
            <button type="submit" class="btn-submit">Add Tracker</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="../shared/auth.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
